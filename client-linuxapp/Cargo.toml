[package]
name = "fdo-client-linuxapp"
version = "0.5.5"
authors = ["Patrick Uiterwijk <patrick@puiterwijk.org>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
log = "0.4"
tokio = { version = "1", features = ["full"] }
sys-info = "0.9"
serde_bytes = "0.11"
rand = "0.8.4"
thiserror = "1"
uuid = { version = "1.3", features = ["v4"] }
openssl = "0.10.72"
serde_cbor = "0.11"
reqwest = { version = "0.12", features = ["native-tls", "blocking"] }

fdo-data-formats = { path = "../data-formats", version = "0.5.5" }
fdo-http-wrapper = { path = "../http-wrapper", version = "0.5.5", features = ["client"] }
fdo-util = { path = "../util", version = "0.5.5" }

[features]
default = ["delegate_support"]
delegate_support = ["fdo-data-formats/delegate_support"]
tpm_support = ["fdo-data-formats/tpm_support"]
